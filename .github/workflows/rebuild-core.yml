name: Yerbas Wallet Rebuild Core

on:
  push:
    branches:
      - main
      - agent/repair-yerbas-compatibility
    paths:
      - "rebuild/**"
      - ".github/workflows/rebuild-core.yml"
  pull_request:
    paths:
      - "rebuild/**"
      - ".github/workflows/rebuild-core.yml"

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Run clean core tests
        run: ../gradlew -p . --no-daemon clean test
